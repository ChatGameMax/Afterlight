      <section class="intro-hero"><div><div class="eyebrow">THE END IS ONLY YOUR BEGINNING</div><h1>Build a world<br>worth <em>surviving.</em></h1><p>Choose what ended the world. Decide who you were when it happened. Then find out what you are willing to build from what remains.</p><div class="intro-stats"><div><strong>06</strong><span>Apocalypses</span></div><div><strong>08</strong><span>Origins</span></div><div><strong>03</strong><span>Eras of collapse</span></div></div></div><div class="hero-art">${skyline()}<span class="pill art-dot">${'<span class="dot"></span>'} A LIGHT REMAINS</span><div class="art-label">NO TWO BEGINNINGS HAVE TO BE THE SAME.</div></div></section>

      <fieldset class="setup-section"><legend><span class="section-number">03</span> Make the rules</legend><div class="presets"><button type="button" data-preset="gentle">A gentler beginning</button><button type="button" data-preset="outbreak">Day-zero outbreak</button><button type="button" data-preset="aftermath">Rebuild the aftermath</button><button type="button" data-preset="hard">Alone in the ash</button></div><div class="form-grid">${range('threat','HOSTILE PRESSURE',c.threat,0,100,'No hostile encounters','Relentless')}${range('abundance','SUPPLY ABUNDANCE',c.abundance,30,180,'Picked clean','Well stocked')}${range('weather','WEATHER SEVERITY',c.weather,0,100,'Stable skies','Harsh conditions')}<div class="field"><label for="seed">WORLD SEED <button type="button" class="small ghost" data-ui="seed">Shuffle</button></label><input id="seed" name="seed" value="${esc(c.seed)}" maxlength="80" required><small>The same setup and seed reproduce the same start.</small></div><div class="field full-width"><label for="name">NAME YOUR WORLD</label><input id="name" name="name" value="${esc(c.name)}" maxlength="60" required></div></div></fieldset></div><aside class="setup-preview" id="setup-preview"></aside></div><div class="setup-foot"><span>Private by default. No account. No telemetry. Turn-based: the world waits for your decisions.</span><div class="row"><button type="button" data-ui="import">Import save</button><button type="button" data-ui="help">How to play</button></div></div></form></main>`;

  function fieldView() {

    return `<div class="field-layout"><div><section class="panel"><div class="panel-head"><h2>${icon('compass')} Regional map</h2><span class="pill">${D.regions[game.config.region].name}</span></div><div class="map-wrap"><div class="map-grid" role="group" aria-label="District map. Select a district; travel to adjacent land with the Enter district button, or use arrow keys.">${game.map.map(t=>`<button class="tile ${t.seen?t.type:'fog'} ${t.searched?'searched':''} ${t.id===selected?'selected':''} ${t.id===game.position?'player':''} ${t.id===game.base?'home':''} ${nearest.includes(t.id)&&t.type!=='water'?'neighbor':''}" data-tile="${t.id}" aria-label="${esc(t.seen?t.name:'Uncharted district')}, column ${t.id%E.WIDTH+1}, row ${Math.floor(t.id/E.WIDTH)+1}${t.id===game.position?', your position':''}${t.id===game.base?', home base':''}${t.seen&&hasFront(t.id)?', roaming threat':''}" aria-pressed="${t.id===selected}" title="${esc(t.seen?t.name:'Uncharted district')}">${icon(t.seen?(t.id===game.base?'home':D.tiles[t.type].icon):'dot')}${t.seen&&hasFront(t.id)?'<span class="threat-mark" aria-hidden="true">!</span>':''}</button>`).join('')}</div></div><div class="map-meta"><div class="legend"><span><i></i>You / home</span><span class="hostile"><i></i>Roaming threat</span><span class="unknown"><i></i>Uncharted</span></div><span class="coordinates">${explored} / ${game.map.length} revealed</span></div></section><section class="panel field-notes"><div class="panel-head"><h2>Field notes</h2><button class="small ghost" data-tab="journal">Full chronicle ${icon('arrow')}</button></div><div class="log-list">${logEntries(6)}</div></section></div><aside class="field-aside"><section class="panel"><div class="context-art">${icon(iconName)}<span class="pill location-tag">${stateText}</span></div><div class="context-body"><div class="eyebrow" style="margin:10px 0">${stateText}</div><h2>${esc(known?target.name:'Beyond the known')}</h2><p>${hint}</p><div class="risk-row"><span class="muted">${current?'Local danger':'Estimated danger'}</span><span class="${known&&E.danger(game,selected)>50?'bad':'gold'}"><i class="risk-dot"></i>${known?E.danger(game,selected)+' / 100':'Unknown'}</span></div>${known&&!target.searched?`<div class="loot-hints">${D.resources.filter(k=>target.stock[k]>0).map(k=>`<span class="pill">${k}</span>`).join('')}</div>`:''}<div class="action-list">${current?`${button('scavenge',`${icon('search')} Search <small>3h</small>`,{},'primary wide')}${button('scout',`${icon('eye')} Scout <small>2h</small>`)}${button('forage',`${icon('food')} Forage <small>4h</small>`)}${button('rest',`${icon('moon')} Rest <small>8h</small>`)}${button('heal',`${icon('cross')} Treat <small>1h</small>`)}`:`${button('move',`${icon('arrow')} Enter district <small>${game.config.profession==='ranger'?'1':'2'}h</small>`,{id:selected},'primary wide')}<button class="wide" data-ui="locate">Return view to your group</button>`}</div><div class="action-note">${current?`${game.map[game.position].searched?'Search is depleted here. Move to a neighboring district for new supplies.':'Searching is one-time; foraging is renewable.'} Daily upkeep occurs at 00:00.`:esc(E.status(game,'move',{id:selected}) || 'Travel advances time. Roaming threats and darkness can make it dangerous.')}</div>${E.atHome(game)&&current?'<button class="small ghost" style="margin-top:10px;width:100%" data-tab="camp">Manage home base →</button>':''}</div></section><div class="radio-panel"><div class="row spread"><span class="eyebrow">THE OPEN FREQUENCY</span>${icon('radio')}</div><div class="wave" aria-hidden="true">${[4,7,13,6,21,15,26,9,17,25,12,7,19,8,23,17,6,13,4,9,17,11,5,8].map(h=>`<i style="height:${h}px"></i>`).join('')}</div><p>${game.camp.radio?`Your relay is online. Signal strength is ${game.signal}%. The Commons ${game.factions[0].rep>=40?'trusts your community.':'needs a reason to trust you.'}`:'“To anyone still out there: we are keeping the lights on. Find water. Grow food. Then build a radio.”'}</p><div class="divider"></div><div class="row spread tiny"><span class="muted">Noise signature</span><span class="gold">${Math.round(game.noise)} / 100</span></div><div class="row spread tiny" style="margin-top:7px"><span class="muted">Weather</span><span>${esc(game.weather)}</span></div>${game.camp.radio?`<div style="margin-top:12px">${button('broadcast','Broadcast · 3h',{},'small')}</div>`:''}</div></aside></div><div class="help-hint"><span><kbd>↑ ↓ ← →</kbd> Travel <kbd>E</kbd> Search <kbd>Q</kbd> Scout <kbd>R</kbd> Rest</span><span>Time advances only when you act. <button class="small ghost" data-ui="help">Field guide</button></span></div>`;
  }
  function campView() {
    const p=E.production(game),n=E.consumption(game);
    return `<div class="page-title"><div class="eyebrow">A PLACE TO COME BACK TO</div><h2 style="margin-top:8px">Build more than a shelter.</h2><p>Construction spends shared supplies and advances time. Upgrades cost more at each level. Work at home base.</p></div>${!E.atHome(game)?'<div class="balance-banner">You are away from home. Follow the gold home marker to return and build. <button class="small ghost" data-ui="home">Show home on map</button></div>':''}<div class="building-grid">${Object.entries(D.structures).map(([key,v])=>{const cost=E.costToBuild(game,key),error=E.status(game,'build',{key});return `<section class="panel building"><div class="row spread"><div class="building-icon">${icon({beds:'home',barricade:'shield',water:'drop',garden:'food',workshop:'tool',radio:'radio'}[key])}</div><span class="pill ${game.camp[key]?'green':''}">Level ${game.camp[key]} / ${v.max}</span></div><h3>${v.name}</h3><p>${v.desc}</p><div class="cost">${game.camp[key]===v.max?'Fully developed':fmtCost(cost)+` · ${v.hours}h`}</div>${button('build',game.camp[key]===v.max?'Complete':game.camp[key]?'Upgrade':'Build',{key},game.camp[key]?'':'primary')}<div class="tiny muted">${esc(error || 'Ready for construction.')}</div></section>`;}).join('')}</div><div class="balance-banner">Daily output: <strong>${p.food} food · ${p.water} water · ${p.scrap} scrap</strong>. Daily needs: <strong>${n.food} food · ${n.water} water</strong>. Current beds: <strong>${game.crew.length} / ${E.capacity(game)}</strong>.</div><section class="panel" style="padding:21px"><div class="row spread wrap"><div><h3>Trade, aid & the regional network</h3><p class="tiny" style="margin-top:8px">The Exchange takes scrap for supplies. Aid earns trust with the Commons.</p></div>${button('broadcast','Broadcast · 1 fuel + 2 scrap · 3h',{},'small primary')}</div><div class="divider"></div><div class="trade-grid">${['food','water','medicine','fuel'].map(key=>button('trade',`Buy ${key==='medicine'?3:key==='fuel'?4:7} ${key} · ${E.tradeCost(game,key).scrap} scrap`,{key},'small')).join('')}${button('aid','Send aid · 4 food + 3 water',{},'small')}</div><p class="tiny" style="margin-top:13px">Radio requires a workshop. The safe-haven objective needs 100% signal, 40 Commons trust, a food garden, and a water collector.</p></section>`;
  }
  function crewView() {
    return `<div class="page-title"><div class="eyebrow">NOBODY IS JUST ANOTHER MOUTH TO FEED</div><h2 style="margin-top:8px">The people who remain.</h2><p>Your leader’s background grants the expedition bonus. Every survivor’s assignment contributes to camp life. Other backgrounds and traits are narrative flavor in this prototype.</p></div><div class="crew-grid">${game.crew.map((c,i)=>`<section class="panel crew-card"><div class="row spread"><div class="avatar">${icon('person')}</div><span class="pill ${i===0?'gold':''}">${i===0?'Expedition leader':'Community member'}</span></div><div><h3>${esc(c.name)}</h3><p class="tiny" style="margin-top:5px">${D.professions[c.profession].name} · ${esc(c.trait)}</p></div><label for="role-${c.id}">DAILY ASSIGNMENT<select id="role-${c.id}" data-role="${c.id}" ${game.over||game.event?'disabled':''}>${[['forager','Forager · +1 food/day'],['guard','Guard · reduce home danger'],['grower','Grower · +2 food/day with garden'],['rest','Rest · health and morale recovery']].map(([key,text])=>`<option value="${key}" ${c.role===key?'selected':''}>${text}</option>`).join('')}</select></label></section>`).join('')}</div><div class="balance-banner">${game.crew.length} survivors · ${E.capacity(game)} beds. Strangers may ask to join during encounters. More people increase daily needs; build living quarters and food production before recruiting.</div><div class="page-title"><h2>Other voices on the radio.</h2><p>Faction strength changes over time. Aid and trade change trust. Strength is descriptive in this first version; trust has gameplay effects.</p></div><div class="factions">${game.factions.map((f,i)=>`<section class="panel faction"><div class="row spread"><h3>${esc(f.name)}</h3>${icon(['people','store','shield'][i])}</div><p>${['A mutual-aid network. Earn 40 trust to help establish the safe-haven relay.','A mobile trading collective. At 50 trust, trades cost one fewer scrap.','An armed outsider faction. Their power and opinion are tracked for future diplomacy.'][i]}</p><div class="bar ${f.rep<0?'red':''}"><i style="width:${(f.rep+100)/2}%"></i></div><div class="row spread tiny"><span>Trust ${f.rep>0?'+':''}${f.rep}</span><span class="muted">Strength ${f.power}</span></div></section>`).join('')}</div>${button('aid','Send aid to the Commons · 4 food + 3 water · 3h',{},'small')}`;
  }
  function journalView() {
    return `<div class="page-title"><div class="eyebrow">A RECORD OF WHAT YOU CHOSE</div><h2 style="margin-top:8px">The chronicle.</h2><p>${game.stats.searched} districts searched · ${game.stats.built} structures built or upgraded · ${game.stats.recruited} survivors welcomed · ${game.stats.broadcasts} broadcasts sent. The latest 100 entries are retained.</p></div><section class="panel"><div class="panel-head"><h2>${esc(game.config.name)}</h2><span class="pill">DAY ${game.day}</span></div><div class="log-list journal-list">${logEntries()}</div></section>`;
  }
  function rulesView() {
    return `<div class="page-title"><div class="eyebrow">A SANDBOX, NOT A CONTRACT</div><h2 style="margin-top:8px">Change the pressure.</h2><p>Adjust difficulty without abandoning your story. Changes are applied only when you press Update world rules.</p></div><form id="rules-form" class="panel rules-panel"><div class="form-grid">${range('threat','HOSTILE PRESSURE',game.config.threat,0,100,'No hostile encounters','Relentless')}${range('abundance','REMAINING SUPPLY ABUNDANCE',game.config.abundance,30,180,'Picked clean','Well stocked')}${range('weather','WEATHER SEVERITY',game.config.weather,0,100,'Stable skies','Harsh conditions')}</div><div class="rules-text">Abundance rescales supplies in unsearched districts. It does not refill searched locations or change supplies already carried. Zero hostile pressure removes roaming fronts and hostile encounters; hunger, thirst, weather, and risky event choices still matter.<br><br>Changing the apocalypse, era, origin, region, group, or leader background requires a new world. Export your current save before replacing it.</div><button type="submit" class="primary">Update world rules</button><div class="divider"></div><div class="row spread wrap"><div class="tiny muted">SEED <strong class="gold">${esc(game.config.seed)}</strong><br>${D.scenarios[game.config.scenario].name} · ${D.eras[game.config.era].name}</div><div class="row"><button type="button" class="small" data-ui="export">Export save</button><button type="button" class="small" data-ui="new">New world</button></div></div></form>`;
  }
  function render() {
    if (!game || setup) {renderSetup();return;}
    selected = Number.isInteger(selected)&&selected>=0&&selected<game.map.length?selected:game.position;
    const views={field:fieldView,camp:campView,crew:crewView,journal:journalView,rules:rulesView};
    const timeIcon=game.hour>=20||game.hour<6?'moon':'sun';
    app.innerHTML=`${storageFailed?'<div class="storage-warning">Device storage is unavailable. Export your save before closing this page.</div>':''}<header class="topbar">${brand()}<div class="top-status"><span class="dot"></span> ${game.over?'EXPEDITION ENDED':'YOUR WORLD IS ALIVE'} <span class="muted">/</span> ${game.crew.length} SURVIVORS</div><div class="toolbar"><button data-ui="save">Save</button><button data-ui="export" class="button-export">Export</button><button data-ui="import">Import</button><button data-ui="new">New<span class="desktop-label"> world</span></button><button data-ui="help" aria-label="Open field guide">?</button></div></header><div class="shell">${sidebar()}<main class="main" id="main-content" tabindex="-1"><div class="heading"><div><div class="eyebrow">${D.scenarios[game.config.scenario].tag} <span class="muted">/ ${D.eras[game.config.era].name}</span></div><h1>${esc(game.config.name)}</h1><p>${D.origins[game.config.origin].name} · ${D.professions[game.config.profession].name} · ${D.regions[game.config.region].name}</p></div><div class="clock"><div class="day">DAY ${pad(game.day)} <span aria-label="${timeIcon==='moon'?'Night':'Daytime'}">${icon(timeIcon)}</span></div><div class="time">${pad(game.hour)}:00</div><div class="tiny muted">${esc(game.weather)}</div></div></div><div class="mobile-vitals"><span>Health <strong>${game.health}%</strong></span><span>Morale <strong>${game.morale}%</strong></span><span>Fatigue <strong>${Math.round(game.fatigue)}%</strong></span><span>Signal <strong>${game.signal}%</strong></span></div>${resourceCards()}${game.over?`<section class="banner"><h2>This expedition has ended.</h2><p>You survived ${game.stats.survived} full days. Your chronicle and save remain available. Start again with a different beginning, or import an earlier backup.</p><div class="end-actions"><button class="small primary" data-ui="new">A new beginning</button><button class="small" data-ui="import">Import a backup</button></div></section>`:game.won?'<section class="banner"><h2>The safe-haven network is alive.</h2><p>Your signal found other survivors. The first objective is complete; this world remains yours to develop.</p></section>':''}${views[tab]()}</main></div>`;
    if(game.event&&!game.over) showEvent(); else if(modal.open) closeModal();
  }
  function showEvent() {
    const def=D.eventDefs[game.event.id];
    showModal(`<div class="dialog-head"><div class="row spread"><span class="eyebrow">A MOMENT THAT MATTERS</span><span class="pill">DAY ${game.day} · ${pad(game.hour)}:00</span></div><h2 id="modal-title">${def.title}</h2></div><div class="dialog-body"><p>${def.text}</p><div class="choices">${def.choices.map((c,i)=>{const reason=E.choiceStatus(game,i);return `<button class="choice" data-choice="${i}" ${reason?'disabled':''} title="${esc(reason||c.hint)}"><strong>${c.label}</strong><small>${c.hint}${reason?' — '+esc(reason):''}</small></button>`;}).join('')}</div><div class="divider"></div><p class="tiny">${game.resources.food} food · ${game.resources.water} water · ${game.resources.scrap} scrap · ${game.resources.medicine} medicine · ${game.resources.fuel} fuel<br>Decisions are permanent in the current save. Time is paused while you decide.</p></div>`);
  }
  function help() {
    showModal(`<div class="dialog-head"><div class="eyebrow">YOUR FIELD GUIDE</div><h2 id="modal-title">Stay alive. Then start living.</h2></div><div class="dialog-body"><p>Afterlight is a turn-based survival sandbox. There is no running timer: every action clearly states its time cost.</p><div class="help-section"><h3>1. Explore and prepare</h3><p>Search your starting district for supplies. Click an adjacent land tile, then Enter district. Search each district once; forage for smaller, renewable returns. Fog hides distant sites. Arrow keys move one district; E searches, Q scouts, R rests, and F forages.</p></div><div class="help-section"><h3>2. Feed the community</h3><p>Every new day at 00:00, the camp produces resources, then consumes food and water. The resource bar shows net daily changes. Missing rations damage the group. Growers need a garden; foragers produce 1 food each per day. Beds and resting survivors support recovery.</p></div><div class="help-section"><h3>3. Manage exposure</h3><p>Noise draws roaming threats. Night raises danger, especially with night-hunting infected. Travel and work cause fatigue; above 75, searching becomes less productive. Low morale also reduces recovered supplies; high morale helps. At extreme fatigue, health can suffer. Rest at home for better recovery. Treat wounds with 2 medicine.</p></div><div class="help-section"><h3>4. Build a future</h3><p>Return home to construct a water collector and garden. Build a workshop, then a radio relay. Send aid to reach 40 trust with the Commons and broadcast until your signal reaches 100%. A working garden and collector complete the safe-haven objective. Play can continue afterward.</p></div><div class="help-section"><h3>5. Keep your world</h3><p>Autosave stays in this browser when local storage is available. Export a JSON backup before changing devices, clearing browser data, or replacing your world. Import checks save validity before replacing the current game. You can change pressure, abundance, and weather during play under World rules.</p></div><div class="help-section"><h3>Prototype boundaries</h3><p>This is a playable foundation, not a finished commercial game. Combat is resolved through risk and events rather than direct tactical controls. The third faction and companion backgrounds are currently narrative groundwork. There is no multiplayer, external AI service, or public server.</p></div></div><div class="dialog-foot"><button class="primary" data-ui="close">Understood</button></div>`);
  }
  function doAction(action,args={}) {
    const result=E.act(game,action,args); if(!result.ok) {toast(result.message,true);return;}
    selected=game.position; save(); render();
    if(!game.event) toast(result.message==='Action complete.'?game.log[0].text:result.message);
  }
  document.addEventListener('click',event=>{
    const el=event.target.closest('button'); if(!el||el.disabled)return;
    if(el.dataset.tile!==undefined) {selected=Number(el.dataset.tile); render(); const b=app.querySelector(`[data-tile="${selected}"]`); b?.focus({preventScroll:true}); return;}
    if(el.dataset.tab) {tab=el.dataset.tab; render(); return;}
    if(el.dataset.action) {doAction(el.dataset.action,{key:el.dataset.key,id:el.dataset.id!==undefined?Number(el.dataset.id):undefined});return;}
    if(el.dataset.choice!==undefined) {const result=E.resolveEvent(game,Number(el.dataset.choice));if(result.ok){closeModal();save();render();toast(game.log[0].text);}else toast(result.message,true);return;}
    if(el.dataset.preset) {
      const form=document.getElementById('world-form');
      const presets={gentle:{threat:15,abundance:155,weather:15,party:2},outbreak:{scenario:'outbreak',era:'zero',origin:'hospital',profession:'medic',threat:50,abundance:115,weather:40,infected:'runners',party:3},aftermath:{scenario:'blackout',era:'years',origin:'farm',profession:'engineer',threat:35,abundance:95,weather:40,party:3},hard:{scenario:'fallout',era:'months',origin:'wanderer',profession:'ranger',region:'desert',threat:80,abundance:55,weather:80,party:1}};
      for(const [key,value] of Object.entries(presets[el.dataset.preset])) form.elements[key].value=String(value);
      updatePreview(); return;
    }
    const ui=el.dataset.ui;
    if(ui==='save') {save(true);render();}
    if(ui==='export') exportSave();
    if(ui==='import') document.getElementById('import-file').click();
    if(ui==='new') {setup=true;renderSetup();window.scrollTo(0,0);}
    if(ui==='resume') {setup=false;render();}
    if(ui==='locate') {selected=game.position;render();}
    if(ui==='home') {selected=game.base;tab='field';render();}
    if(ui==='help') help();
    if(ui==='close') {closeModal();if(game?.event&&!setup)showEvent();}
    if(ui==='seed') {document.getElementById('seed').value=`AFTER-${Math.random().toString(36).slice(2,10).toUpperCase()}`;updatePreview();}
  });
  document.addEventListener('input',event=>{
    if(event.target.closest('#world-form')) updatePreview();
    if(event.target.closest('#rules-form')) document.querySelector(`[data-value="${event.target.name}"]`)?.replaceChildren(document.createTextNode(`${event.target.value}%`));
  });
  document.addEventListener('change',event=>{
    if(event.target.dataset.role) {const r=E.act(game,'role',{id:Number(event.target.dataset.role),role:event.target.value});if(r.ok){save();render();toast(r.message);}else toast(r.message,true);}
  });
  document.addEventListener('submit',event=>{
    if(event.target.id==='world-form') {event.preventDefault();game=E.newGame(formConfig());setup=false;tab='field';selected=game.position;save();render();window.scrollTo(0,0);toast('Your story has begun. Search your starting district, then secure food and water.');}
    if(event.target.id==='rules-form') {event.preventDefault();const result=E.tune(game,Object.fromEntries(new FormData(event.target).entries()));save();render();toast(result.message);}
  });
  document.getElementById('import-file').addEventListener('change',async event=>{
    const file=event.target.files[0];event.target.value='';if(!file)return;
    if(file.size>2000000){toast('Save file is too large. Maximum size: 2 MB.',true);return;}
    try {
      const imported=E.deserialize(await file.text());
      showModal(`<div class="dialog-head"><div class="eyebrow">RESTORE A WORLD</div><h2 id="modal-title">Import this save?</h2></div><div class="dialog-body"><p><strong>${esc(imported.config.name)}</strong><br>Day ${imported.day}, ${pad(imported.hour)}:00 · ${imported.crew.length} survivors<br>${D.scenarios[imported.config.scenario].name}<br><br>${game?'This replaces your current device autosave. Export your current world before continuing.':'The validated world will become your active game.'}</p></div><div class="dialog-foot"><button class="primary" id="confirm-import">Restore world</button>${game?'<button data-ui="export">Export current</button>':''}<button data-ui="close">Cancel</button></div>`);
      document.getElementById('confirm-import').onclick=()=>{game=imported;setup=false;selected=game.position;tab='field';closeModal();save();render();toast('Save restored. Your story continues.');};
    } catch(e) {toast(e.message || 'Could not read that save file.',true);}
  });
  modal.addEventListener('cancel',event=>{if(game?.event&&!setup)event.preventDefault();});
  document.addEventListener('keydown',event=>{
    if(!game||setup||game.over||modal.open||event.ctrlKey||event.metaKey||event.altKey||event.repeat||event.target.closest('input,select,textarea,[contenteditable="true"]'))return;
    const moves={ArrowUp:game.position-E.WIDTH,ArrowDown:game.position+E.WIDTH,ArrowLeft:game.position-1,ArrowRight:game.position+1};
    if(Object.hasOwn(moves,event.key)){event.preventDefault();if(tab==='field')doAction('move',{id:moves[event.key]});return;}
    const keys={e:'scavenge',q:'scout',r:'rest',f:'forage'}; const action=keys[event.key.toLowerCase()]; if(action){event.preventDefault();doAction(action);}
  });
  let stored=null;
  try {stored=localStorage.getItem(SAVE_KEY);}
  catch {storageFailed=true;setTimeout(()=>toast('Local saving is unavailable in this browser. Export a JSON backup to keep your progress.',true),100);}
  if(stored){try{game=E.deserialize(stored);selected=game.position;}catch{setTimeout(()=>toast('The stored save is invalid. Import a backup or start a new world.',true),100);}}
  if(game)render();else renderSetup();
})();

</script>
</body>
</html>
