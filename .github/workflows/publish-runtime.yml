name: Publish packaged runtime

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-runtime.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-packaged-runtime
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and publish standalone runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          parent = os.environ['GITHUB_SHA']
          if repo != 'ChatGameMax/Afterlight' or os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise RuntimeError('This publication is restricted to the release repository main branch.')
          base = 'https://api.github.com/repos/' + repo
          token = os.environ['GH_TOKEN']
          def api(path, method='GET', data=None):
              payload = None if data is None else json.dumps(data).encode('utf-8')
              request = urllib.request.Request(base + path, data=payload, method=method, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'afterlight-runtime-publisher'
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = response.read()
              return json.loads(result) if result else {}

          expected = [
              '06e3ad967e70594f03c9b3f2a6d5c0e570cee4e87fb07d44072acb691e531894',
              '66f5dcc3e809f03756f825d8261090ee4e7946edebf1441c7234b3eea88c8186',
              'c304b758561595fabb7ae084c0e7da1c1df0f02be8de8ee37436f4d3604ff2e6',
              'be6c51167f7f24226c224bf4d937e91549d0a366ddb5f49467c11333a1ccf551'
          ]
          parts = []
          paths = [f'release/part-{i:02d}.b64' for i in range(4)]
          for i, path in enumerate(paths):
              item = api('/contents/' + path + '?ref=' + parent)
              part = base64.b64decode(item['content']).decode('ascii').strip()
              # Correct one identified transport omission, then require the original checksum.
              if i == 1 and item['sha'] == '8d24c24f653d6abb51cde551da26791e5482593e':
                  part = part.replace('X5W8VAT', 'X5W8WVAT', 1)
              if hashlib.sha256(part.encode('ascii')).hexdigest() != expected[i]:
                  raise RuntimeError(f'Runtime transport checksum mismatch: segment {i}')
              parts.append(part)
          html = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          digest = hashlib.sha256(html).hexdigest()
          if len(html) != 106121 or digest != '1d95a06b518b544b79f745216b97a7325174e1387dfef5f9f1ff91fbe0ba7b4c':
              raise RuntimeError('Runtime release checksum mismatch. Nothing will be published.')
          text = html.decode('utf-8')
          if not text.lstrip().lower().startswith('<!doctype html>'):
              raise RuntimeError('Invalid standalone runtime document.')
          pathlib.Path('verified-release').mkdir(exist_ok=True)
          pathlib.Path('verified-release/index.html').write_bytes(html)
          pathlib.Path('verified-release/SHA256SUMS').write_text(digest + '  index.html\n')

          current = api('/git/ref/heads/main')['object']['sha']
          if current != parent:
              raise RuntimeError('Main advanced during publication. Refusing to overwrite concurrent work.')
          source_tree = api('/git/commits/' + parent)['tree']['sha']
          blob = api('/git/blobs', 'POST', {'content': base64.b64encode(html).decode('ascii'), 'encoding': 'base64'})
          entries = [{'path': 'index.html', 'mode': '100644', 'type': 'blob', 'sha': blob['sha']}]
          entries += [{'path': path, 'mode': '100644', 'type': 'blob', 'sha': None} for path in paths]
          tree = api('/git/trees', 'POST', {'base_tree': source_tree, 'tree': entries})
          commit = api('/git/commits', 'POST', {
              'message': 'deploy: publish verified AFTERLIGHT standalone runtime',
              'tree': tree['sha'], 'parents': [parent]
          })
          api('/git/refs/heads/main', 'PATCH', {'sha': commit['sha'], 'force': False})
          published = api('/contents/index.html?ref=' + commit['sha'])
          if published['sha'] != blob['sha']:
              raise RuntimeError('Published runtime blob did not match the verified release.')
          print('Published commit: ' + commit['sha'])
          print('Runtime SHA256: ' + digest)
          print('Runtime bytes: ' + str(len(html)))
          print('Removed all four transport segments from the published tree.')
          print('GitHub Pages activation is separate from runtime publication.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# Runtime published\n\nCommit: `' + commit['sha'] + '`\n\n')
              summary.write('SHA256: `' + digest + '`\n\nRuntime size: 106121 bytes.\n\n')
              summary.write('Transport segments removed. GitHub Pages activation is a separate repository setting.\n')
          PY
      - name: Retain verified public runtime for readback
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: afterlight-public-runtime
          path: verified-release/
          if-no-files-found: error
          retention-days: 7
